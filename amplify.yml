version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        # Amplify passes console variables to the build only; write the server-side ones to
        # .env.production so the enquiry form can read them at runtime.
        - env | grep -E '^(NEXT_PUBLIC_|RESEND_API_KEY|ENQUIRY_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
