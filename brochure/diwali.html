<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<title>Shaadi Drafts · Diwali 2026 Hampers</title>
<!--
  Diwali hamper price list. Build with `npm run brochure -- --diwali`; the pages are generated from
  brochure/diwali/hampers.mjs and inserted into the body.
-->
<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: normal; src: url("{{FONTS}}/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url("{{FONTS}}/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: normal; src: url("{{FONTS}}/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 400; src: url("{{FONTS}}/manrope/files/manrope-latin-400-normal.woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 500; src: url("{{FONTS}}/manrope/files/manrope-latin-500-normal.woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 600; src: url("{{FONTS}}/manrope/files/manrope-latin-600-normal.woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 700; src: url("{{FONTS}}/manrope/files/manrope-latin-700-normal.woff2"); }
  @font-face { font-family: "Jost"; font-weight: 600; src: url("{{FONTS}}/jost/files/jost-latin-600-normal.woff2"); }

  :root {
    --b: {{BLEED}};                 /* bleed: 0mm on screen, 3mm for print */
    --w: calc(210mm + 2 * var(--b));
    --h: calc(297mm + 2 * var(--b));
    --m: calc(16mm + var(--b));     /* safe margin */

    --paper: #f6f1e7;
    --paper-deep: #ece4d2;
    --card: #fbf8f1;
    --ink: #262c1d;
    --ink-soft: #6a6f5a;
    --olive: #4f5b2e;
    --olive-deep: #3b4422;
    --sage: #8a9668;
    --gold: #c6a15b;
    --gold-soft: #e7d6a8;
    --night: #161a11;
    --line: rgba(38, 44, 29, 0.14);
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Manrope", system-ui, sans-serif;
  }

  @page { size: var(--w) var(--h); margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: var(--sans); color: var(--ink); font-size: 9.2pt; line-height: 1.6; background: #888; }

  .page {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: var(--paper);
    padding: var(--m);
    break-after: page;
    display: flex;
    flex-direction: column;
  }
  .page:last-child { break-after: auto; }
  .dark { background: var(--olive-deep); color: var(--paper); }
  .night { background: var(--night); color: var(--paper); }

  h1, h2, h3, .serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.015em; line-height: 1.02; }
  em { font-style: italic; }
  .eyebrow { font-size: 6.6pt; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-soft); }
  .dark .eyebrow, .night .eyebrow { color: var(--gold-soft); }
  .accent { color: var(--olive); }
  .dark .accent, .night .accent { color: var(--gold-soft); }
  .soft { color: var(--ink-soft); }
  .dark .soft, .night .soft { color: rgba(246, 241, 231, 0.72); }
  .h2 { font-size: 34pt; margin-top: 4mm; }
  .lead { font-size: 10.5pt; line-height: 1.6; max-width: 120mm; margin-top: 4mm; }
  .rule { height: 1px; background: var(--line); }
  .dark .rule, .night .rule { background: rgba(246, 241, 231, 0.16); }

  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ph { position: relative; overflow: hidden; border-radius: 4mm; background: var(--paper-deep); }
  .arch { border-radius: 999mm 999mm 0 0; }
  .art { background: var(--card); border: 1px solid var(--line); padding: 2.2mm; border-radius: 4mm; }
  .art img { object-fit: contain; border-radius: 2.5mm; }

  /* Running folio on interior pages */
  .folio {
    position: absolute; left: var(--m); right: var(--m); bottom: calc(var(--b) + 8mm);
    display: flex; justify-content: space-between; font-size: 6.4pt; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft);
  }
  .dark .folio, .night .folio { color: rgba(246, 241, 231, 0.5); }

  .tag { display: inline-block; font-size: 6.4pt; font-weight: 600; padding: 0.9mm 2.6mm; border-radius: 99mm; background: var(--paper-deep); margin: 0 1mm 1mm 0; }
  .dark .tag, .night .tag { background: rgba(246, 241, 231, 0.12); }
  .dots { list-style: none; }
  .dots li { display: flex; gap: 2.4mm; align-items: baseline; }
  .dots li::before { content: ""; width: 1mm; height: 1mm; border-radius: 50%; background: var(--gold); flex-shrink: 0; transform: translateY(-0.4mm); }

  .logo text { font-family: "Jost", sans-serif; }

  /* ---------- Cover ---------- */
  .cover { padding-bottom: calc(var(--m) + 2mm); }
  .cover .top { display: flex; justify-content: space-between; align-items: center; }
  .cover .hero { position: relative; margin: 10mm auto 0; width: 128mm; height: 158mm; }
  .cover .hero .ph { position: absolute; inset: 0; }
  .cover .hero .ring { position: absolute; inset: -3.2mm; border: 0.35mm solid rgba(198, 161, 91, 0.6); border-radius: 999mm 999mm 0 0; }
  .cover .badge { position: absolute; right: -14mm; bottom: -12mm; width: 34mm; height: 34mm; filter: drop-shadow(0 3mm 5mm rgba(22, 26, 17, 0.25)); }
  .cover h1 { font-size: 50pt; line-height: 0.98; margin-top: auto; letter-spacing: -0.025em; }
  .cover .sub { display: flex; justify-content: space-between; align-items: end; margin-top: 6mm; }

  /* ---------- Festive petals (matches the site's petal shower) ---------- */
  .petals { position: absolute; inset: 0; pointer-events: none; }
  .petals svg { position: absolute; width: 6mm; height: 6mm; }

  /* ---------- Grids ---------- */
  .row { display: flex; gap: 6mm; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col > .ph { min-height: 0; }

  /* ---------- Diwali price list ---------- */
  .toran { position: absolute; left: 0; right: 0; top: 0; height: 11mm; display: flex; justify-content: space-between; padding: 0 calc(var(--b) + 2mm); }
  .toran svg { width: 7mm; height: 11mm; flex-shrink: 0; }
  .price { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 3mm 6mm; border-radius: 99mm; background: var(--card); border: 0.35mm solid var(--gold); }
  .price b { font-family: var(--serif); font-size: 22pt; font-weight: 600; line-height: 1; font-variant-numeric: lining-nums; }
  .price span { font-size: 5.8pt; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-top: 1mm; }
  .chip { display: inline-flex; align-items: center; gap: 2mm; font-size: 7.2pt; font-weight: 600; padding: 1.2mm 3mm; border-radius: 99mm; background: var(--paper-deep); }
  .chip i { width: 2.2mm; height: 2.2mm; border-radius: 50%; display: inline-block; }
  ol.inside { list-style: none; counter-reset: n; columns: 2; column-gap: 8mm; font-size: 8.8pt; }
  ol.inside li { counter-increment: n; break-inside: avoid; display: flex; gap: 2.5mm; padding: 1.3mm 0; border-bottom: 1px solid var(--line); }
  ol.inside li::before { content: counter(n, decimal-leading-zero); font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 10pt; line-height: 1.3; min-width: 5mm; }
  .cap { font-size: 6.2pt; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2mm; text-align: center; }
  table.glance { width: 100%; border-collapse: collapse; font-size: 8.4pt; }
  table.glance th { text-align: left; font-size: 6.2pt; letter-spacing: 0.2em; text-transform: uppercase; color: var(--paper); background: var(--olive-deep); padding: 2.6mm 3mm; font-weight: 600; }
  table.glance th:last-child, table.glance td:last-child { text-align: right; }
  table.glance td { padding: 1.1mm 3mm; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.glance tr.tier td { background: var(--paper-deep); font-size: 6.2pt; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); padding: 1.3mm 3mm; white-space: nowrap; }
  table.glance td.name { font-family: var(--serif); font-size: 12.5pt; white-space: nowrap; }
  table.glance td.amt { font-family: var(--serif); font-size: 13pt; font-weight: 600; color: var(--olive); white-space: nowrap; font-variant-numeric: lining-nums; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
